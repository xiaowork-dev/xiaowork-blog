name: ci
on:
  push:
  pull_request:

# Least privilege: CI only reads the repository (and its releases, in the deploy job). There is no
# deployment or release workflow — releases are created manually (docs/RELEASING.md).
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      # Markdown renderer incl. XSS vectors.
      - run: pnpm test
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/api/go.sum
      # Fails if go.mod/go.sum are not already tidy instead of silently rewriting them.
      - run: go mod tidy -diff
        working-directory: apps/api
      - run: go mod verify
        working-directory: apps/api
      - run: go test ./...
        working-directory: apps/api
      - run: go vet ./...
        working-directory: apps/api
      - run: test -z "$(gofmt -l apps/api)"
      # Generated code must match db/queries + db/migrations.
      - name: sqlc diff and vet
        run: |
          docker run --rm -v "$PWD/apps/api:/src" -w /src sqlc/sqlc:1.31.0 diff
          docker run --rm -v "$PWD/apps/api:/src" -w /src sqlc/sqlc:1.31.0 vet
  db-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        # Ephemeral CI-only server; trust auth avoids putting any password in the repository.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Test SMTP server for the real mailer test; never a public mailbox.
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['1025:1025', '8025:8025']
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      TEST_SMTP_ADDR: localhost:1025
      TEST_MAILPIT_API: http://localhost:8025
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/api/go.sum
      - run: go test -race -count=1 -v ./...
        working-directory: apps/api
      - name: blog-migrate up is repeatable
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go run ./cmd/blog-migrate up
          go run ./cmd/blog-migrate up
          go run ./cmd/blog-migrate status
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - run: cp .env.example .env
      - run: docker compose --env-file .env config --quiet
      # On Linux the bind-mounted media directory must belong to the API user (uid/gid 10001), see README.
      - run: mkdir -p .data/media && sudo chown 10001:10001 .data/media
      - run: docker compose --env-file .env up -d --build --wait --wait-timeout 300
      - name: Health and migration checks
        run: |
          docker compose --env-file .env ps -a
          docker compose --env-file .env logs migrate
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          test "$(docker compose --env-file .env exec -T db sh -c 'psql -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT max(version_id) FROM goose_db_version WHERE is_applied"')" = "7"
      # Browser-path auth flow: Nuxt proxy → Go API → PostgreSQL, mail through SMTP into Mailpit.
      - run: node scripts/e2e-auth.mjs http://127.0.0.1:3000 http://127.0.0.1:8025
      - name: First-admin bootstrap, media / article / public blog / comments / admin e2e and persistence across a rebuild
        run: |
          PW="$(openssl rand -hex 16)"  # throwaway, generated per run
          admin() { docker compose --env-file .env run --rm -T --no-deps --entrypoint /usr/local/bin/blog-admin api "$@"; }
          printf '%s\n' "$PW" | admin create-admin -email admin@example.test -nickname CI
          if printf '%s\n' "$PW" | admin create-admin -email admin2@example.test -nickname CI2; then echo "second admin was created"; exit 1; fi
          export E2E_ADMIN_EMAIL=admin@example.test E2E_ADMIN_PASSWORD="$PW"
          node scripts/e2e-media.mjs http://127.0.0.1:3000
          node scripts/e2e-articles.mjs http://127.0.0.1:3000
          node scripts/e2e-public.mjs http://127.0.0.1:3000
          node scripts/e2e-comments.mjs http://127.0.0.1:3000 http://127.0.0.1:8025
          node scripts/e2e-admin.mjs http://127.0.0.1:3000 http://127.0.0.1:8025
          node scripts/e2e-media.mjs http://127.0.0.1:3000 --keep "$RUNNER_TEMP/persist.json"
          node scripts/e2e-articles.mjs http://127.0.0.1:3000 --keep "$RUNNER_TEMP/article.json"
          docker compose --env-file .env down
          docker compose --env-file .env up -d --force-recreate --wait --wait-timeout 300
          node scripts/e2e-media.mjs http://127.0.0.1:3000 --verify "$RUNNER_TEMP/persist.json"
          node scripts/e2e-articles.mjs http://127.0.0.1:3000 --verify "$RUNNER_TEMP/article.json"
          admin media-check
      - if: failure()
        run: docker compose --env-file .env logs api web
      - if: always()
        run: docker compose --env-file .env down
  # Production deploy scripts on a fresh Ubuntu host (P8-A): install (twice), admin bootstrap, HTTPS through an
  # nginx that stands in for Nginx Proxy Manager, auth e2e, backup and restore. Throwaway values only.
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x -P deploy -S warning deploy/*.sh deploy/test/drill.sh
      - name: production compose file is valid
        run: APP_VERSION=ci TRUSTED_PROXY_CIDRS=172.18.0.0/16 PROXY_NETWORK=npm_proxy docker compose -f deploy/compose.prod.yaml --env-file deploy/env.production.example config --quiet
      - name: simulated proxy network, NPM-equivalent nginx and mail catcher
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          docker network create npm_proxy
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
            -keyout "$RUNNER_TEMP/certs/site.key.pem" -out "$RUNNER_TEMP/certs/site.pem" 2>/dev/null
          docker run -d --name npm-sim --network npm_proxy -p 127.0.0.1:8443:443 \
            -v "$PWD/deploy/nginx/npm-equivalent.conf:/etc/nginx/conf.d/default.conf:ro" -v "$RUNNER_TEMP/certs:/etc/nginx/certs:ro" nginx:1.30.5-alpine
          docker run -d --name mail-sim --network npm_proxy -p 127.0.0.1:8025:8025 axllent/mailpit:v1.32.0
      - name: read-only precheck
        run: |
          sudo bash deploy/precheck.sh --npm-network npm_proxy --domain localhost --smtp 127.0.0.1:8025 | tee "$RUNNER_TEMP/precheck.txt"
          grep -q '预检结束' "$RUNNER_TEMP/precheck.txt"
          if grep -iE 'password|secret' "$RUNNER_TEMP/precheck.txt"; then echo "precheck output mentions secrets"; exit 1; fi
          test -z "$(docker ps -a --format '{{.Names}}' | grep '^xiaowork-blog')"
      - name: install.sh (generate .env, install, idempotent re-run)
        run: |
          sudo deploy/install.sh
          sudo sed -i -e 's|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=https://localhost:8443|' -e 's|^DATA_DIR=.*|DATA_DIR=/srv/xiaowork-blog-ci|' \
            -e 's|^SMTP_HOST=.*|SMTP_HOST=mail-sim|' -e 's|^SMTP_PORT=.*|SMTP_PORT=1025|' -e 's|^SMTP_TLS=.*|SMTP_TLS=none|' \
            -e 's|^PROXY_NETWORK=.*|PROXY_NETWORK=npm_proxy|' deploy/.env
          sudo deploy/install.sh
          sudo deploy/install.sh | tee "$RUNNER_TEMP/again.log"
          grep -q '无需重复安装' "$RUNNER_TEMP/again.log"
          sudo deploy/admin.sh status
          test -z "$(docker ps --format '{{.Names}} {{.Ports}}' | grep '^xiaowork-blog' | grep -F '0.0.0.0')"
      - name: HTTPS through the proxy, admin bootstrap and auth e2e
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          curl -skf -D - -o /dev/null https://localhost:8443/ | grep -i '^strict-transport-security'
          curl -skf -D - -o /dev/null https://localhost:8443/api/v1/auth/csrf | grep -i '^set-cookie: __Host-blog_csrf=.*Secure'
          openssl rand -hex 16 | sudo deploy/admin.sh create-admin -email owner@example.test -nickname CI
          node scripts/e2e-auth.mjs https://localhost:8443 http://127.0.0.1:8025
      - name: manage.sh status / check and explicit update target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          sudo deploy/manage.sh status
          sudo -E deploy/manage.sh check
          # `! cmd` would not fail the step under bash -e, hence explicit checks.
          if sudo deploy/update.sh 2> "$RUNNER_TEMP/update.err"; then echo "update.sh ran without a target"; exit 1; fi
          grep -q 'manage.sh update' "$RUNNER_TEMP/update.err"
          if sudo -E deploy/manage.sh update < /dev/null; then echo "manage.sh update proceeded without a release"; exit 1; fi
      - name: backup.sh and restore.sh
        run: |
          B="$(sudo deploy/backup.sh --label ci | tail -1)"
          sudo test -f "$B/db.dump"
          sudo deploy/restore.sh "$B" --yes
          sudo deploy/admin.sh media-check
          # The restored database holds the admin and the user registered by the auth e2e above.
          users() { sudo docker compose -p xiaowork-blog exec -T db sh -c "psql -tA -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"$1\""; }
          test "$(users "SELECT count(*) FROM users WHERE role = 'ADMIN' AND email = 'owner@example.test'")" = 1
          test "$(users "SELECT count(*) FROM users WHERE role = 'USER' AND email_verified_at IS NOT NULL")" -ge 1
          curl -skf https://localhost:8443/api/v1/site | grep -q '"site_title":"XiaoWork Blog"'
      - if: failure()
        run: sudo docker compose -p xiaowork-blog logs --tail 100 api web db
