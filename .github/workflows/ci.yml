name: p0-checks
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      # Fails if go.mod/go.sum are not already tidy instead of silently rewriting them.
      - run: go mod tidy -diff
        working-directory: apps/api
      - run: go mod verify
        working-directory: apps/api
      - run: go test ./...
        working-directory: apps/api
      - run: go vet ./...
        working-directory: apps/api
      - run: test -z "$(gofmt -l apps/api)"
  compose-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env config --quiet
