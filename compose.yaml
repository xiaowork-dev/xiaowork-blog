name: xiaowork-blog

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      # PostgreSQL 18+ official image volume root changed.
      - blog_postgres:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # One-shot schema migration (goose, embedded SQL). Re-running on an up-to-date DB is a no-op.
  # Shares the api build context/Dockerfile, so BuildKit reuses the same layers.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    entrypoint: ["/usr/local/bin/blog-migrate"]
    command: ["up"]
    restart: 'no'
    environment:
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable'
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      HTTP_ADDR: ':8080'
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable'
      MEDIA_ROOT: '/data/media'
      # Browser-facing origin: e-mail links and the CSRF Origin check. https is required except on localhost.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      # Local default: the Mailpit catcher below. Production: set SMTP_* in .env (real credentials stay out of Git).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-XiaoWork Blog <no-reply@xiaowork.local>}
      # X-Forwarded-For is only believed from these networks (Nuxt / Nginx Proxy Manager on Docker networks).
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      # Host bind mount: survives `docker compose down` and image rebuilds.
      - ./.data/media:/data/media
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      NUXT_API_INTERNAL_URL: 'http://api:8080'
      # Canonical / Open Graph / RSS / sitemap origin; the same browser-facing origin the API uses.
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Development mail catcher: every e-mail the API sends lands here (UI/API on 127.0.0.1 only).
  # Not used in production, where SMTP_* points at the real mail service.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '500'
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  blog_postgres:
