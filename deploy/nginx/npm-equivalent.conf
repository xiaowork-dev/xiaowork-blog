# Plain-nginx equivalent of the Nginx Proxy Manager proxy host for XiaoWork Blog (P8-A).
#
# In production these rules are entered in the NPM UI (see docs/deploy/部署与运维手册.md §4); this file is
# what the isolated deployment drill runs to simulate NPM, and a reference for anyone using plain nginx.
# Upstream names are the network aliases from deploy/compose.prod.yaml on the shared proxy network.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/site.pem;
    ssl_certificate_key /etc/nginx/certs/site.key.pem;

    # Uploads: article/site images up to 10 MiB (MEDIA_MAX_BYTES) plus multipart overhead.
    client_max_body_size 12m;

    # Resolve the containers at request time so nginx starts before the blog is up (Docker DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $blog_api http://xiaowork-blog-api:8080;
    set $blog_web http://xiaowork-blog-web:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # API and media files go straight to the Go API (API-DD §2).
    location /api/v1/ { proxy_pass $blog_api; }
    location /media/  { proxy_pass $blog_api; }
    # Everything else is rendered by Nuxt (pages, sitemap.xml, rss.xml, robots.txt, assets).
    location /        { proxy_pass $blog_web; }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
