# Reverse proxy for PROXY_MODE=host-loopback (P8-B6): nginx/OpenResty running on the HOST network — e.g.
# 1Panel's OpenResty container — in front of the blog's ports published on 127.0.0.1.
#
# In 1Panel these rules are entered as a website's reverse proxy (docs/deploy/1Panel-OpenResty部署指南.md);
# this file is what the isolated deployment drill runs, and a reference for plain nginx on a host.
# Ports must match WEB_HOST_PORT / API_HOST_PORT in deploy/.env (defaults 13000 / 18081).

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/site.pem;
    ssl_certificate_key /etc/nginx/certs/site.key.pem;

    # Uploads: article/site images up to 10 MiB (MEDIA_MAX_BYTES) plus multipart overhead.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    # $http_host keeps a non-default port (e.g. :8443); with the standard 443 it equals $host.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Appends the real client address; the API reads it right to left and only trusts its own app network.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # No URI after the port: the request path (/api/v1/..., /media/...) is passed on unchanged.
    # Writing `proxy_pass http://127.0.0.1:18081/;` (with a trailing slash) would strip the prefix — do not.
    location /api/v1/ { proxy_pass http://127.0.0.1:18081; }
    location /media/  { proxy_pass http://127.0.0.1:18081; }
    # Everything else is rendered by Nuxt (pages, sitemap.xml, rss.xml, robots.txt, assets).
    location /        { proxy_pass http://127.0.0.1:13000; }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
